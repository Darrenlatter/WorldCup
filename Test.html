  function calculateWildcardRouting(wildcards) {
    const slots = [
      { id: 'M74', host: 'E', allowed: ['A','B','C','D','F'] },
      { id: 'M77', host: 'I', allowed: ['C','D','F','G','H'] },

    let assignment = {};
    function solve(wcIndex) {
      if (wcIndex === 8) return true;
      let wc = wildcards[wcIndex];

        let slot = slots[i];
        if (!assignment[slot.id] && slot.allowed.includes(wc.group)) {

          if (solve(wcIndex + 1)) return true;
          delete assignment[slot.id];
        }
      }
      return false;
    }
    solve(0);
    return assignment;
  }
