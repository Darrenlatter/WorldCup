<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FIFA World Cup 2026™ Live Sweepstake Engine</title>

<style>
:root {
  --primary: #0052cc;
  --secondary: #078045;
  --dark: #1a202c;
  --light: #e1e4e6;
  --border: #e2e8f0;
  --accent: #e53e3e;
  --gold: #d69e2e;
}

body.dark {
  --primary: #6ea8ff;
  --secondary: #38a169;
  --dark: #edf2f7;
  --light: #0f172a;
  --border: #2d3748;
  --accent: #f56565;
  --gold: #ecc94b;
}

* { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,Segoe UI,sans-serif; }

body {
  background: var(--light);
  color: var(--dark);
  padding:20px;
}

body.dark .card,
body.dark .match-row { background:#1e293b; }

header {
  background:linear-gradient(135deg,var(--primary),#002266);
  color:white;
  padding:25px;
  border-radius:12px;
  margin-bottom:25px;
  text-align:center;
}

.container { max-width:1400px; margin:auto; }

.card {
  background:white;
  border:1px solid var(--border);
  border-radius:10px;
  padding:20px;
  margin-bottom:20px;
}

.tabs { display:flex; gap:10px; overflow:auto; margin-bottom:20px; }

.tab-btn {
  padding:10px 20px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:600;
}

.tab-btn.active { background:var(--primary); color:white; }

table { width:100%; border-collapse:collapse; }
th, td { padding:8px; border-bottom:1px solid var(--border); }

.rank-cell { font-weight:bold; }
.pts-cell { font-weight:800; color:var(--primary); }

/* Mobile table */
@media(max-width:768px){

  #tab-playertable .card {
    overflow-x:auto;
  }

  table {
    min-width:700px;
    font-size:0.75rem;
  }

  th,td { padding:6px 4px; }

  .player-cell-teams { display:none; }
}
</style>
</head>

<body>

<header>

  <div style="display:flex;align-items:center;justify-content:center;gap:15px;flex-wrap:wrap;">
    <img src="https://upload.wikimedia.org/wikipedia/commons/1/17/2026_FIFA_World_Cup_emblem.svg"
         style="height:60px;">
    <div>
      <h1>FIFA World Cup 2026™ Live Sweepstake Engine</h1>
      <p><span style="color:#00ffcc;">●</span> Live Tournament Feed</p>
    </div>
  </div>

  <div style="margin-top:12px;">
    <button onclick="toggleDarkMode()" id="theme-toggle">
      🌙 Dark Mode
    </button>
  </div>

</header>

<div class="container">

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('playertable')">Player Table</button>
</div>

<div id="tab-playertable" class="tab-content">

  <div class="card">
    <h2>🏆 Player League Table</h2>

    <table>
      <thead>
        <tr>
          <th>#</th><th>Player</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th>
        </tr>
      </thead>
      <tbody id="player-league-rows"></tbody>
    </table>

  </div>

</div>

</div>

<script>

/* DEMO DATA */
const players = [
  {name:"Darren", p:5,w:3,d:1,l:1,gf:7,ga:3},
  {name:"Alex", p:5,w:2,d:2,l:1,gf:6,ga:4},
  {name:"Jamie", p:5,w:1,d:2,l:2,gf:4,ga:6}
];

function renderTable(){
  const tbody = document.getElementById('player-league-rows');

  const sorted = players.map(p=>{
    p.gd = p.gf - p.ga;
    p.pts = p.w*3 + p.d;
    return p;
  }).sort((a,b)=> b.pts-a.pts || b.gd-a.gd || b.gf-a.gf);

  tbody.innerHTML = sorted.map((p,i)=>`
    <tr>
      <td class="rank-cell">${i+1}</td>
      <td>${p.name}</td>
      <td>${p.p}</td>
      <td>${p.w}</td>
      <td>${p.d}</td>
      <td>${p.l}</td>
      <td>${p.gf}</td>
      <td>${p.ga}</td>
      <td>${p.gd>0?'+':''}${p.gd}</td>
      <td class="pts-cell">${p.pts}</td>
    </tr>
  `).join('');
}

/* DARK MODE */
function toggleDarkMode(){
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  localStorage.setItem('theme', isDark?'dark':'light');
  document.getElementById('theme-toggle').innerText =
    isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
}

(function(){
  const saved = localStorage.getItem('theme');
  if(saved==='dark'){
    document.body.classList.add('dark');
  }
})();

/* Tabs */
function switchTab(id){
  document.querySelectorAll('.tab-content').forEach(t=>t.style.display='none');
  document.getElementById('tab-'+id).style.display='block';
}

renderTable();

</script>

</body>
</html>
